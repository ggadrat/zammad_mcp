[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zammad-mcp"
version = "0.2.0"
description = "Serveur MCP (read-only) pour interroger Zammad, utilisable en stdio ou en streamable-http avec Mistral."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
zammad-mcp = "zammad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["zammad_mcp"]
